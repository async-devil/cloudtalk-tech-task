<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first is the design system's default, so the viewport meta is not optional chrome:
         without it every touch target measured at 390x844 in the e2e is wrong. `viewport-fit=cover`
         pairs with the safe-area insets a notched device needs (`@repo/styles`' `--spacing-safe-*`
         tokens). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
