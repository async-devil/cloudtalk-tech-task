# Workspace-inherited task defaults. Scoped to product projects only — `root` and `tools/*`
# declare `layer: 'tool'` and define their own tasks, so these defaults never apply there.
inheritedBy:
  layers: ['application', 'library']

tasks:
  lint:
    command: 'biome check .'
  format:
    command: 'biome check --write .'
    options:
      runInCI: false
  # typecheck/test/test-integration need upstream dist/ present: workspace deps resolve through
  # package.json#exports into dist, so a clean checkout fails without the upstream build having
  # run first — an incidental-scheduling flake otherwise.
  typecheck:
    command: 'tsc --noEmit'
    deps:
      - '^:build'
  build:
    command: 'tsc'
    deps:
      - '^:build'
  # Vitest per ADR-0010 (bun test is not the sanctioned runner).
  #
  # Vitest runs on Node, not on the Bun the application ships on, and that is deliberate rather
  # than incidental. Forcing the suites onto Bun (`bun x --bun vitest run`) was tried and breaks
  # zod's named exports under vitest's transform — every config slice fails at module evaluation
  # with `z` undefined. Node is the runtime vitest supports; the runtime the code SHIPS on is
  # proven by the integration suites, which exercise it through the real process.
  #
  # The DOM suites therefore avoid jsdom, whose bundled undici needs a `webidl` helper that only
  # exists in Node 22+ — see the environment note in packages/styles/vitest.config.ts.
  test:
    command: 'vitest run'
    deps:
      - '^:build'
  # ADR-0010: the test suites are typechecked too, and `typecheck` above structurally cannot do it.
  # A package's own `tsconfig.json` carries `include: ["src"]` because that same config drives
  # `build`, and emitting test files into `dist/` would ship them — so `test/` and
  # `test-integration/` sit outside every compile the chain performs. vitest transpiles rather than
  # typechecks, and a container suite may not run locally at all. Before this task, a type error in
  # a durability harness was invisible everywhere and surfaced in CI as a runtime failure in a file
  # nothing had ever compiled.
  #
  # Wrapped for the same reason `test-integration` is: the throwaway config this needs (the
  # package's own, with `composite`/`rootDir`/`outDir` off and the test directories added) is
  # written once in the script rather than as a second committed tsconfig per package that a new
  # package can silently forget.
  typecheck-tests:
    command: 'bun ../../tools/arch-checks/src/typecheck-tests.ts'
    deps:
      - '^:build'

  # Wrapped rather than invoked directly, so "no Docker" has one answer instead of seven: a loud
  # local skip, a hard CI failure. See the script's header for why those two differ.
  test-integration:
    command: 'bun ../../tools/arch-checks/src/run-integration-suite.ts'
    deps:
      - '^:build'
    options:
      # Every test-integration task spins up its own Testcontainers stack (postgres/redis), and a
      # full `moon ci` was launching several at once. Container startup under that contention is
      # the root cause of "passes in isolation, flakes in the full chain": proof bodies that embed
      # a wall-clock assumption observe a slower host than they were written against. This mutex
      # removes the contention by serializing every test-integration task onto one virtual
      # resource. Slower wall-clock, but the suites it protects are durability proofs.
      mutex: 'container-test-integration'
  dev:
    command: 'bun run dev'
    options:
      runInCI: false
