language: typescript
layer: library

tags:
  - tier-facade
  - liftable

tasks:
  # test-integration spawns probes as standalone `bun` processes (harness/spawn-probe.ts) that
  # import '@repo/messaging' by package specifier, resolving through package.json#exports into
  # dist/. The workspace-inherited task only depends on '^:build' (this package's dependencies),
  # never its own — so on a clean checkout this package's own dist/ never gets built first.
  test-integration:
    deps:
      - 'build'
  # Same reason as test-integration above, and caught the same way that one already was: the
  # throwaway config `typecheck-tests` (ADR-0010) writes for this package includes
  # `test-integration/probes/*.probe.ts`, which import '@repo/messaging' by package specifier —
  # the inherited task's `deps: ['^:build']` never guarantees this package's OWN dist/ exists
  # first. Observed failing in CI on exactly this race: "Cannot find module '@repo/messaging'".
  typecheck-tests:
    deps:
      - 'build'
